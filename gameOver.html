<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory-GameOver</title>
</head>

<body class="gameOver">
    <main class="gameOver__main">
        <h1 class="gameOver__headline">Game Over</h1>
        <div class="gameOver__score">
            <span class="gameOver__subline">Final score</span>
            <div class="game__header__players">
                <div class="game__header__players--flex">
                    <img class="game__score-icon" data-player="blue" src="" alt="">
                    <span class="game__header__players--blue"><span class="game__player-name">Blue </span><span
                            data-score="blue">0</span></span>
                </div>
                <div class="game__header__players--flex">
                    <img class="game__score-icon" data-player="orange" src="" alt="">
                    <span class="game__header__players--orange"><span class="game__player-name">Orange </span><span
                            data-score="orange">0</span></span>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
